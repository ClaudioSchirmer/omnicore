syntax = "proto3";

package omnicore.grpctest.v1;

option go_package = "github.com/ClaudioSchirmer/omnicore/internal/testpb";

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "omnicore/v1/query.proto";

// Test-only messages for the web/grpc and infra/grpcclient unit suites. Every command field is
// `optional` so the strict-presence (FullBody parity) check is exercisable.
// The Search* family composes the shared omnicore.v1 read components — the
// shapes the PUBLIC Auto constructors demand; the older flat messages keep
// exercising the private wrapper layer directly.

message CreateGadgetRequest {
  optional string name = 1;
  optional string kind = 2;
  optional int32 rating = 3;
}

message CreateGadgetResponse {
  string id = 1;
  string name = 2;
}

message ListGadgetsRequest {
  optional string name_contains = 1;
  bool only_total = 2;
}

message ListGadgetsResponse {
  int64 total = 1;
  repeated string names = 2;
}

message UpdateGadgetRequest {
  optional string id = 1;
  optional string name = 2;
  optional string kind = 3;
}

message ArchiveGadgetRequest {
  optional string id = 1;
}

message ArchiveGadgetResponse {}

message SearchGadgetsRequest {
  omnicore.v1.PaginationRequest pagination = 1;
  repeated omnicore.v1.OrderByField order_by = 2;
  google.protobuf.FieldMask fields = 3;
  SearchGadgetsFilters filters = 4;
}

message SearchGadgetsFilters {
  omnicore.v1.StringFilter name = 1;
  omnicore.v1.Int64Filter rating = 2;
  omnicore.v1.DoubleFilter price = 3;
  omnicore.v1.BoolFilter active = 4;
  omnicore.v1.TimestampFilter created_at = 5;
}

message GadgetItem {
  string id = 1;
  string name = 2;
  optional string kind = 3;
}

message SearchGadgetsResponse {
  repeated GadgetItem items = 1;
  omnicore.v1.PaginationInfo pagination = 2;
}

// ── bridge-plan edge shapes (bind_test.go) ──────────────────────────────

message MapCarrier {
  map<string, string> labels = 1;
}

message TimeCarrier {
  google.protobuf.Timestamp when = 1;
}

message MaskCarrier {
  google.protobuf.FieldMask mask = 1;
}

message ChildThing {
  string full_name = 1;
}

message ParentThing {
  repeated ChildThing kids = 1;
  ChildThing favorite = 2;
}

message TwoGroupsRequest {
  SearchGadgetsFilters a = 1;
  SearchGadgetsFilters b = 2;
}

message TwoRepeatsResponse {
  repeated GadgetItem a = 1;
  repeated GadgetItem b = 2;
  omnicore.v1.PaginationInfo pagination = 3;
}

message OnlyPaginationInfoResponse {
  omnicore.v1.PaginationInfo pagination = 1;
}

message TwoPaginationInfosResponse {
  repeated GadgetItem items = 1;
  omnicore.v1.PaginationInfo a = 2;
  omnicore.v1.PaginationInfo b = 3;
}

message GetGadgetRequest {
  optional string id = 1;
  bool include_archived = 2;
}

message GetGadgetResponse {
  string id = 1;
  string name = 2;
}

// ── scalar-kind matrix (bind_scalars_test.go) ───────────────────────────
//
// Every proto scalar kind in ONE message, so the bridge is proven per kind
// in BOTH directions. The dialects agree on most of them; the 64-bit
// integers are the pair protojson quotes and encoding/json does not, and an
// enum travels as its member NAME.

enum Flavor {
  FLAVOR_UNSPECIFIED = 0;
  FLAVOR_SWEET = 1;
  FLAVOR_SALTY = 2;
}

message ScalarChild {
  int64 child_big = 1;
  string child_label = 2;
}

message FlavorCarrier {
  Flavor flavor = 1;
}

message ScalarMatrix {
  int64 big = 1;
  sint64 signed_big = 2;
  sfixed64 fixed_signed_big = 3;
  uint64 unsigned_big = 4;
  fixed64 fixed_unsigned_big = 5;
  int32 small = 6;
  uint32 unsigned_small = 7;
  double ratio = 8;
  float fraction = 9;
  bool flag = 10;
  string label = 11;
  bytes blob = 12;
  Flavor flavor = 13;
  google.protobuf.Timestamp when = 14;
  repeated int64 bigs = 15;
  repeated string labels = 16;
  ScalarChild child = 17;
  repeated ScalarChild children = 18;
  optional int64 maybe_big = 19;
}
