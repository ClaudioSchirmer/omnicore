# golangci-lint v2 configuration for omnicore.
#
# Conservative, high-signal set: the standard linters (errcheck, govet,
# ineffassign, staticcheck, unused) plus a few bug-catchers with low false-
# positive rates. Style-churn linters are intentionally left off — the goal is
# to catch defects, not to reformat a codebase that already holds a 95% coverage
# floor. Generated files (*.pb.go) are auto-excluded via `generated: lax`.
#
# The engine/transport build tags are mandatory (see the Makefile). This config
# lints the postgres+kafka view; `make lint TAGS='mysql nats'` covers the other
# axis (a tag-gated file is only analyzed under a matching tag).
version: "2"

run:
  build-tags:
    - postgres
    - kafka

linters:
  default: standard
  enable:
    - bodyclose   # HTTP response bodies must be closed (real leak class)
    - misspell    # typos in comments and strings
    - unconvert   # unnecessary type conversions
  exclusions:
    generated: lax
    # Standard golangci-lint presets for well-known false positives — errcheck on
    # Close()/fmt.Fprint (always-nil writes to buffers), std-library error-handling
    # idioms. Uses the maintained lists instead of hand-rolled patterns.
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # Tests get latitude: an unchecked best-effort error or an unclosed response
      # body in a test that exits anyway is noise, not a defect. `unused` is also
      # unreliable on tests here — this codebase's tests exercise types and
      # (unexported) fields via reflection (schema generation, field-label
      # extraction, struct scanning), which static use-analysis cannot see, so it
      # false-positives on deliberate reflection fixtures.
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - unused
      # The seven translation catalogs are the one sanctioned home of non-English
      # text (CLAUDE.md rule #4); misspell's English dictionary only false-positives
      # there (e.g. German "Spanisch", Italian "Impossibile").
      - path: application/translation/
        linters:
          - misspell

formatters:
  enable:
    - gofmt
